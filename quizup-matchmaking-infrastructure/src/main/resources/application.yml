spring:
  application:
    name: quizup-matchmaking
  profiles:
    default: local

  flyway:
    locations: classpath:db/migration/matchmaking

axon:
  distributed:
    enabled: true

microservice:
  swagger:
    description: QuizUp Matchmaking Module - Lobby-based player matching
  websocket:
    enabled: true

logging:
  level:
    io.github.quizup: ${QUIZUP_LOG_LEVEL:INFO}
